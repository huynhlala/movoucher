<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Đang mở phong thư...</title>
  <script>
    // DANH SÁCH VOUCHER VÀ TỶ LỆ % (Tổng các số tyLe phải bằng 100)
    const danhSachQua = [
      { link: "https://canva.link/ko0bcwgjyr0a7m2", tyLe: 35 },
      { link: "https://canva.link/snqn8lnrqtsto4e", tyLe: 30 },
      { link: "https://canva.link/9wrhhrghy9fcfas", tyLe: 20 },
      { link: "https://canva.link/vpumcpyfnuzzp9l", tyLe: 15 }
    ];

    const soNgauNhien = Math.random() * 100;
    let congDon = 0;

    for (let qua of danhSachQua) {
      congDon += qua.tyLe;
      if (soNgauNhien < congDon) {
        window.location.replace(qua.link);
        break;
      }
    }
  </script>
</head>
<body>
  <p style="text-align:center; margin-top: 50px; font-family: sans-serif;">Đang mở quà của bạn, vui lòng chờ giây lát...</p>
</body>
</html>
